<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PivotMatrix · 指标监控演示</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#172033;background:#f4f7fb;--blue:#2d8cff;--line:#e6ebf3;--muted:#758095;--card:#fff}
    *{box-sizing:border-box}body{margin:0}.shell{max-width:1440px;margin:auto;padding:28px 34px 48px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-size:22px;font-weight:750;letter-spacing:-.3px}.brand span{color:var(--blue)}.top a{color:#60708a;text-decoration:none;font-size:14px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px}.hero h1{font-size:30px;margin:0 0 8px}.hero p{margin:0;color:var(--muted)}.range{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:#42516b}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}.kpi,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px #213b6410}.kpi{padding:20px}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:28px;margin:12px 0 4px}.up{color:#18a77a;font-size:13px}.section-title{font-size:16px;font-weight:700;margin:24px 0 14px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.panel{padding:22px;min-height:300px}.panel h2{font-size:16px;margin:0 0 4px}.panel p{margin:0;color:var(--muted);font-size:13px}.chart{height:210px;margin-top:18px}.chart svg{width:100%;height:100%}.legend{display:flex;gap:18px;color:var(--muted);font-size:12px;margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.empty{display:grid;place-items:center;height:220px;color:#9aa5b6;font-size:13px;text-align:center}.empty b{display:block;color:#6d7890;font-size:34px;margin-bottom:8px}@media(max-width:900px){.shell{padding:22px 16px}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:560px){.kpis{grid-template-columns:1fr}.hero{display:block}.range{display:inline-block;margin-top:16px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand">Pivot<span>Matrix</span></div><a href="pivotmatrix-login.html">进入演示</a></header>
    <section class="hero"><div><h1>指标监控</h1><p>面向智能应用的统一运行概览，当前页面使用脱敏演示数据。</p></div><div class="range">时间范围　近 7 天　⌄</div></section>
    <section class="kpis"><article class="kpi"><small>活跃应用</small><strong>24</strong><span class="up">↗ 12.5%</span></article><article class="kpi"><small>总调用次数</small><strong>18,420</strong><span class="up">↗ 8.2%</span></article><article class="kpi"><small>平均响应耗时</small><strong>1.28<span style="font-size:15px"> s</span></strong><span class="up">↓ 6.4%</span></article><article class="kpi"><small>请求成功率</small><strong>98.6<span style="font-size:15px">%</span></strong><span class="up">↗ 1.1%</span></article></section>
    <div class="section-title">基础分析</div>
    <section class="grid"><article class="panel"><h2>调用趋势</h2><p>时间区间内的请求调用变化</p><div class="chart"><svg viewBox="0 0 720 240" preserveAspectRatio="none"><path d="M0 194H720M0 130H720M0 66H720" stroke="#e7ecf4" stroke-dasharray="4 5"/><path d="M0 176 L100 152 L200 160 L300 110 L400 128 L500 84 L600 102 L720 48 L720 220 L0 220Z" fill="#2d8cff20"/><path d="M0 176 L100 152 L200 160 L300 110 L400 128 L500 84 L600 102 L720 48" fill="none" stroke="#2d8cff" stroke-width="3"/><g fill="#2d8cff"><circle cx="0" cy="176" r="4"/><circle cx="100" cy="152" r="4"/><circle cx="200" cy="160" r="4"/><circle cx="300" cy="110" r="4"/><circle cx="400" cy="128" r="4"/><circle cx="500" cy="84" r="4"/><circle cx="600" cy="102" r="4"/><circle cx="720" cy="48" r="4"/></g></svg></div><div class="legend"><span><i class="dot" style="background:#2d8cff"></i>调用次数</span><span>单位：次</span></div></article><article class="panel"><h2>成功率</h2><p>时间区间内的请求结果分布</p><div class="chart"><svg viewBox="0 0 520 240" preserveAspectRatio="none"><path d="M0 194H520M0 130H520M0 66H520" stroke="#e7ecf4" stroke-dasharray="4 5"/><path d="M0 42 L90 46 L180 38 L270 48 L360 34 L450 40 L520 30" fill="none" stroke="#17b890" stroke-width="3"/><g fill="#17b890"><circle cx="0" cy="42" r="4"/><circle cx="90" cy="46" r="4"/><circle cx="180" cy="38" r="4"/><circle cx="270" cy="48" r="4"/><circle cx="360" cy="34" r="4"/><circle cx="450" cy="40" r="4"/><circle cx="520" cy="30" r="4"/></g></svg></div><div class="legend"><span><i class="dot" style="background:#17b890"></i>成功率</span><span>单位：%</span></div></article></section>
    <div class="section-title">异常与消耗</div>
    <section class="grid"><article class="panel"><h2>异常概览</h2><p>当前时间范围内暂无需要处理的公开演示告警</p><div class="empty"><div><b>✓</b>运行状态良好</div></div></article><article class="panel"><h2>费用趋势</h2><p>时间区间内的费用变化</p><div class="chart"><svg viewBox="0 0 520 240" preserveAspectRatio="none"><path d="M0 194H520M0 130H520M0 66H520" stroke="#e7ecf4" stroke-dasharray="4 5"/><path d="M0 160 L90 148 L180 154 L270 120 L360 134 L450 106 L520 112" fill="none" stroke="#8b66ec" stroke-width="3"/><g fill="#8b66ec"><circle cx="0" cy="160" r="4"/><circle cx="90" cy="148" r="4"/><circle cx="180" cy="154" r="4"/><circle cx="270" cy="120" r="4"/><circle cx="360" cy="134" r="4"/><circle cx="450" cy="106" r="4"/><circle cx="520" cy="112" r="4"/></g></svg></div><div class="legend"><span><i class="dot" style="background:#8b66ec"></i>费用</span><span>单位：元</span></div></article></section>
  </main>
</body>
</html>
